name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  functions:
    name: Function tests (${{ matrix.function }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        function: [update-sensor-tracker, enforce-grace-period]
    defaults:
      run:
        working-directory: functions/${{ matrix.function }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run tests
        run: python -m pytest -q

  ui:
    name: UI build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/pages/Sensor Release Tracker
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061  # v4.2.0
        with:
          version: 10
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238  # v6.2.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pages/Sensor Release Tracker/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      # Foundry deploys the committed src/dist as-is and never builds the UI.
      - name: Check committed build is up to date
        run: |
          if [ -n "$(git status --porcelain -- src/dist)" ]; then
            git status --short -- src/dist
            echo "::error::src/dist is out of date. Run 'pnpm build' in 'ui/pages/Sensor Release Tracker' and commit the result."
            exit 1
          fi
