name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  functions:
    name: Test ${{ matrix.function }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        function: [update-sensor-tracker, enforce-grace-period]
    defaults:
      run:
        working-directory: functions/${{ matrix.function }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: functions/${{ matrix.function }}/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests
        run: python -m pytest -q

  ui:
    name: Build Sensor Release Tracker UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/pages/Sensor Release Tracker
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061  # v4.2.0
        with:
          version: 10
      - name: Use Node 22
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238  # v6.2.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pages/Sensor Release Tracker/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Committed dist must match the source
        # manifest.yml deploys src/dist as-is, so a stale build ships silently.
        run: |
          if ! git diff --quiet -- src/dist; then
            echo "::error::src/dist is out of date. Run 'pnpm build' and commit the result."
            git --no-pager diff --stat -- src/dist
            exit 1
          fi
